<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scam Buzzer Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings-shell">
    <header class="settings-header">
      <div class="brand-mark">SB</div>
      <div>
        <p class="eyebrow">SCAM BUZZER</p>
        <h1>Settings</h1>
        <p class="intro">Tune how the local detector connects and alerts you.</p>
      </div>
    </header>

    <form id="settings-form" novalidate>
      <section class="settings-section">
        <p class="section-kicker">Connection</p>
        <label class="field" for="api-base-url">
          <span>Local API URL</span>
          <small>Base address of your FastAPI server. Example: http://localhost:8000</small>
          <input id="api-base-url" name="apiBaseUrl" type="url" autocomplete="url" required>
          <em id="url-error" class="field-error"></em>
        </label>
        <div class="connection-row">
          <button type="button" id="test-connection" class="secondary-btn">
            Test connection
          </button>
          <span id="connection-status" class="connection-status" role="status"></span>
        </div>
      </section>

      <section class="settings-section">
        <p class="section-kicker">Detection</p>
        <label class="field" for="high-risk-threshold">
          <span>High-risk bias <output id="threshold-value" for="high-risk-threshold">70%</output></span>
          <small>Show a high-risk alert when the calculated risk reaches this level.</small>
          <input id="high-risk-threshold" name="highRiskThreshold" type="range" min="0.5" max="0.95" step="0.05">
        </label>
      </section>

      <section class="settings-section">
        <p class="section-kicker">Behavior</p>
        <label class="toggle-row" for="show-high-risk-banner">
          <span><strong>Show high-risk banner</strong><small>Display an alert at the top of flagged pages.</small></span>
          <input id="show-high-risk-banner" name="showHighRiskBanner" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="toggle-row" for="auto-analyze">
          <span><strong>Analyze pages automatically</strong><small>Check each page after it finishes loading.</small></span>
          <input id="auto-analyze" name="autoAnalyze" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <div class="actions">
        <span id="save-status" role="status"></span>
        <button type="button" id="reset-defaults" class="secondary-btn">
          Reset to defaults
        </button>
        <button type="submit">Save settings</button>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
